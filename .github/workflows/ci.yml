name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Integration tests (embedded PostgreSQL)
        run: pnpm test:integration
        env:
          AUTH_SECRET: ci-auth-secret-phase1-not-production
          EMAIL_PROVIDER: memory
      - run: pnpm build
      - run: pnpm validate:env
        env:
          APP_ENV: local
          DATABASE_URL: postgres://clinic:clinic@127.0.0.1:5432/clinic
          AUTH_SECRET: ci-auth-secret-phase1-not-production-32chars
      - name: Secret pattern scan
        run: |
          ! rg -i "(smtp_pass|api[_-]?key)\s*=\s*[^$\s]" --glob '!*.example' --glob '!.env*' --glob '!pnpm-lock.yaml' || true
      - run: pnpm audit --audit-level=critical
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - name: Start embedded PostgreSQL and migrate
        run: |
          pnpm db:up &
          sleep 8
          export DATABASE_URL=$(node -e "console.log(require('./.data/embedded-pg.json').url)")
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
          pnpm db:migrate
          pnpm db:seed-rbac
        env:
          AUTH_SECRET: ci-auth-secret-phase1-not-production
      - run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          AUTH_SECRET: ci-auth-secret-phase1-not-production
          EMAIL_PROVIDER: memory
          ENABLE_TEST_OTP_ENDPOINT: "true"
        continue-on-error: true
